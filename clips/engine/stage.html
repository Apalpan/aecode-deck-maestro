<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>AECODE · Historias de la IA — stage</title>
<style>
@font-face { font-family: "Manrope"; src: url("fonts/Manrope-VF.ttf") format("truetype"); font-weight: 200 800; }

:root {
  --bg: #0E1121; --deep: #0D0F1F; --surface: #13172F; --raised: #1B1E3C; --soft: #222341;
  --border: rgba(124,126,223,.40); --border-soft: rgba(124,126,223,.20);
  --text: #EEF3F8; --muted: #A2B4CB; --softtext: #8C97DC;
  --primary: #4A3AC1; --lav: #A6A7FF; --green: #17B14E; --green2: #19C356; --blue: #4465EE; --violet: #6D12E3;
  --grad: linear-gradient(92deg, #A6A7FF 0%, #8F95FF 30%, #6C7CF6 62%, #4465EE 100%);
  --grad-btn: linear-gradient(90deg, #4465EE, #6D12E3);
  --grad-ok: linear-gradient(90deg, #19C356, #493AC1);
}
* { box-sizing: border-box; }
html, body { margin: 0; width: 1080px; height: 1920px; overflow: hidden; background: var(--bg); }
body { font-family: "Manrope", sans-serif; color: var(--text); -webkit-font-smoothing: antialiased; }
#stage { position: relative; width: 1080px; height: 1920px; overflow: hidden; background: var(--bg); }

/* ---------- fondo ---------- */
.bg, .bg > * { position: absolute; inset: 0; }
.grid {
  background-image:
    linear-gradient(rgba(166,167,255,.055) 1px, transparent 1px),
    linear-gradient(90deg, rgba(166,167,255,.055) 1px, transparent 1px);
  background-size: 72px 72px;
  -webkit-mask-image: radial-gradient(ellipse 85% 70% at 50% 42%, #000 35%, transparent 100%);
}
.glow { inset: auto; width: 1400px; height: 1400px; border-radius: 50%; }
.g1 { background: radial-gradient(circle, rgba(74,58,193,.50) 0%, rgba(74,58,193,0) 62%); }
.g2 { background: radial-gradient(circle, rgba(68,101,238,.30) 0%, rgba(68,101,238,0) 60%); }
.g3 { background: radial-gradient(circle, rgba(23,177,78,.14) 0%, rgba(23,177,78,0) 60%); }
.vignette { background: radial-gradient(ellipse 120% 90% at 50% 45%, transparent 55%, rgba(8,9,20,.75) 100%); }

/* ---------- header ---------- */
header { position: absolute; top: 118px; left: 80px; right: 80px; height: 64px; display: flex; align-items: center; gap: 20px; }
.iso { width: 56px; height: 56px; background: var(--grad);
  -webkit-mask: url("../../brand/assets/logos/aecode_isotipo_principal.png") center / contain no-repeat; }
.series { font-weight: 700; font-size: 26px; letter-spacing: .20em; text-transform: uppercase; color: var(--muted); }
.series b { color: var(--text); font-weight: 800; }
.ep { margin-left: auto; font-weight: 700; font-size: 24px; letter-spacing: .12em; color: var(--lav);
  border: 1.5px solid var(--border); border-radius: 999px; padding: 10px 22px; background: rgba(19,23,47,.6); }
.progress { position: absolute; top: 210px; left: 80px; right: 80px; height: 5px; border-radius: 99px; background: rgba(166,167,255,.12); overflow: hidden; }
.progress i { display: block; height: 100%; width: 0; border-radius: 99px; background: var(--grad-btn); box-shadow: 0 0 18px rgba(84,80,217,.8); }

/* ---------- escenas ---------- */
#scenes { position: absolute; left: 0; right: 0; top: 290px; height: 1000px; }
.scene { position: absolute; inset: 0; padding: 0 80px; display: flex; flex-direction: column; justify-content: center; align-items: flex-start; visibility: hidden; }
.scene.center { align-items: center; text-align: center; }
[data-a] { will-change: transform, opacity; }

.kicker { display: inline-flex; align-items: center; gap: 16px; font-weight: 800; font-size: 32px; letter-spacing: .18em; text-transform: uppercase; color: var(--lav); margin-bottom: 34px; }
.kicker .dot { width: 14px; height: 14px; border-radius: 50%; background: var(--green); box-shadow: 0 0 16px var(--green); }
.pill { display: inline-flex; align-items: center; gap: 14px; font-weight: 800; font-size: 26px; letter-spacing: .16em; text-transform: uppercase;
  color: var(--text); padding: 14px 26px; border-radius: 999px; border: 1.5px solid var(--border); background: rgba(27,30,60,.75); }
.pill.green { color: #fff; border-color: transparent; background: var(--grad-ok); box-shadow: 0 12px 28px rgba(25,195,86,.24); }
.pill.violet { border-color: transparent; background: var(--grad-btn); box-shadow: 0 0 24px rgba(84,80,217,.55); }

.h-xl { font-weight: 800; font-size: 132px; line-height: 1.02; letter-spacing: -0.035em; margin: 0; }
.h-lg { font-weight: 800; font-size: 108px; line-height: 1.04; letter-spacing: -0.03em; margin: 0; }
.h-md { font-weight: 800; font-size: 80px; line-height: 1.08; letter-spacing: -0.025em; margin: 0; }
.body-lg { font-weight: 600; font-size: 44px; line-height: 1.3; color: var(--muted); }
.w { display: inline-block; }
em, .acc, .acc-g { padding-bottom: .1em; }
em, .acc { font-style: normal; background: var(--grad); -webkit-background-clip: text; background-clip: text; color: transparent; }
.acc-g { font-style: normal; background: linear-gradient(92deg, #5BE38A, #19C356); -webkit-background-clip: text; background-clip: text; color: transparent; }

.card { background: linear-gradient(180deg, rgba(27,30,60,.92), rgba(19,23,47,.92)); border: 1.5px solid var(--border-soft);
  border-radius: 28px; box-shadow: 0 18px 50px rgba(0,0,0,.28); }

/* hook */
.hookwrap { position: relative; }
.bgword { position: absolute; left: -12px; top: -260px; font-weight: 800; font-size: 330px; letter-spacing: -0.05em; line-height: 1;
  color: transparent; -webkit-text-stroke: 2px rgba(166,167,255,.17); white-space: nowrap; }

/* rewind */
.counter { font-weight: 800; font-size: 300px; line-height: .9; letter-spacing: -0.05em; font-variant-numeric: tabular-nums; }
.ruler { position: relative; width: 920px; height: 120px; margin-top: 40px; }
.ruler .line { position: absolute; left: 0; right: 0; top: 40px; height: 3px; background: rgba(166,167,255,.25); border-radius: 3px; }
.ruler .tick { position: absolute; top: 28px; width: 3px; height: 27px; background: rgba(166,167,255,.4); border-radius: 2px; }
.ruler .tick span { position: absolute; top: 40px; left: 50%; transform: translateX(-50%); font-size: 22px; font-weight: 700; color: var(--softtext); }
.ruler .mark { position: absolute; top: 20px; width: 44px; height: 44px; margin-left: -22px; border-radius: 50%; background: var(--green); box-shadow: 0 0 0 10px rgba(23,177,78,.18), 0 0 30px rgba(25,195,86,.7); }

/* people */
.people { display: grid; grid-template-columns: 1fr 1fr; gap: 24px; width: 100%; }
.person { padding: 30px 30px; display: flex; align-items: center; gap: 24px; }
.avatar { flex: none; width: 100px; height: 100px; border-radius: 50%; display: grid; place-items: center; font-weight: 800; font-size: 34px;
  background: var(--grad-btn); box-shadow: 0 0 24px rgba(84,80,217,.45); }
.person .n { font-weight: 800; font-size: 38px; line-height: 1.1; }
.person .o { font-weight: 600; font-size: 27px; color: var(--muted); margin-top: 6px; }
.term { margin-top: 56px; }
.term .t { font-weight: 800; font-size: 100px; letter-spacing: -0.03em; line-height: 1; }
.term .note { margin-top: 18px; font-weight: 600; font-size: 28px; color: var(--muted); }

/* stats */
.stats { display: flex; flex-direction: column; gap: 22px; width: 100%; margin-top: 10px; }
.stat { position: relative; display: flex; align-items: baseline; gap: 30px; padding: 26px 40px; }
.stat .v { font-weight: 800; font-size: 108px; line-height: 1; letter-spacing: -0.04em; white-space: nowrap; }
.stat .l { font-weight: 700; font-size: 38px; color: var(--muted); flex: 1; }
.stat .strike { position: absolute; left: 30px; right: 30px; top: 50%; height: 7px; border-radius: 6px; background: #E26A62; transform-origin: left center; box-shadow: 0 0 18px rgba(226,106,98,.6); }
.stat.ok { border-color: rgba(25,195,86,.55); background: linear-gradient(180deg, rgba(23,177,78,.16), rgba(19,23,47,.92)); }
.stat.ok { flex-direction: column; gap: 10px; }
.stat.ok .l { color: #BFEFD0; font-size: 32px; }

/* quote */
.qmark { font-weight: 800; font-size: 300px; line-height: .6; height: 150px; margin-bottom: 10px; }
.quote { font-weight: 700; font-size: 64px; line-height: 1.2; letter-spacing: -0.015em; }
.translation { margin-top: 36px; font-weight: 600; font-size: 34px; line-height: 1.35; color: var(--muted); padding-left: 26px; border-left: 4px solid var(--primary); }

/* statement */
.sun { position: absolute; left: 50%; top: 50%; width: 960px; height: 960px; margin: -480px 0 0 -480px; }

/* curves */
.chart { width: 920px; height: 640px; margin-top: 20px; }
.chart text { font-family: Manrope; font-weight: 700; }
.legend { display: flex; gap: 36px; margin-top: 20px; font-weight: 700; font-size: 26px; color: var(--muted); }
.legend span { display: inline-flex; align-items: center; gap: 12px; }
.legend i { display: inline-block; width: 44px; height: 5px; border-radius: 3px; }

/* versus */
.vs { display: grid; grid-template-columns: 1fr 130px 1fr; align-items: center; width: 100%; }
.fighter { padding: 46px 30px; text-align: center; }
.fighter .icon { width: 150px; height: 150px; margin: 0 auto 28px; }
.fighter .n { font-weight: 800; font-size: 54px; letter-spacing: -0.02em; }
.fighter .o { font-weight: 600; font-size: 26px; color: var(--muted); margin-top: 8px; }
.vsdot { width: 110px; height: 110px; border-radius: 50%; display: grid; place-items: center; margin: 0 auto; font-weight: 800; font-size: 36px;
  background: var(--grad-btn); box-shadow: 0 0 34px rgba(84,80,217,.7); }

/* go */
.board { width: 800px; height: 800px; }
.tag { position: absolute; font-weight: 800; font-size: 30px; padding: 12px 22px; border-radius: 999px; white-space: nowrap; }
.tag.q { background: #E26A62; color: #fff; box-shadow: 0 10px 30px rgba(226,106,98,.45); }

/* dots */
.dotsbox { position: relative; width: 620px; height: 620px; margin: 30px auto 0; }
.dotsbox canvas { width: 620px; height: 620px; }

/* timer */
.ring { width: 600px; height: 600px; }
.clock { position: absolute; left: 50%; top: 50%; transform: translate(-50%,-50%); text-align: center; }
.clock .mm { font-weight: 800; font-size: 150px; letter-spacing: -0.04em; font-variant-numeric: tabular-nums; line-height: 1; }
.clock .u { font-weight: 700; font-size: 28px; letter-spacing: .2em; color: var(--muted); text-transform: uppercase; margin-top: 10px; }

/* score */
.score { display: grid; grid-template-columns: 1fr 90px 1fr; align-items: center; width: 100%; }
.score .side { text-align: center; }
.score .num { font-weight: 800; font-size: 240px; line-height: 1; letter-spacing: -0.05em; }
.score .who { font-weight: 800; font-size: 40px; margin-top: 6px; }
.score .sep { font-weight: 800; font-size: 120px; color: var(--softtext); text-align: center; }
.games { display: flex; gap: 22px; justify-content: center; margin-top: 50px; }
.game { width: 118px; text-align: center; font-weight: 800; font-size: 22px; color: var(--muted); letter-spacing: .1em; }
.game i { display: block; width: 64px; height: 64px; margin: 0 auto 12px; border-radius: 50%; background: var(--raised); border: 2px solid var(--border); }
.game.ai i { background: radial-gradient(circle at 35% 30%, #6C63E0, #2A2170); border-color: transparent; }
.game.hu i { background: radial-gradient(circle at 35% 30%, #FFFFFF, #CFD7E6); border-color: transparent; }

/* lesson */
.chips { display: flex; flex-wrap: wrap; gap: 18px; margin-top: 50px; }
.chip { font-weight: 700; font-size: 32px; padding: 16px 28px; border-radius: 999px; border: 1.5px solid var(--border); background: rgba(27,30,60,.8); color: var(--text); display: inline-flex; align-items: center; gap: 14px; }
.chip i { width: 14px; height: 14px; border-radius: 50%; background: var(--green); box-shadow: 0 0 12px var(--green); }

/* acronym */
.word { font-weight: 800; font-size: 210px; letter-spacing: -0.05em; line-height: 1; }
.word .dim { color: rgba(238,243,248,.92); }
.expand { margin-top: 44px; display: flex; flex-direction: column; gap: 16px; width: 100%; }
.xrow { display: flex; align-items: center; gap: 26px; padding: 20px 30px; font-weight: 700; font-size: 44px; color: var(--muted); }
.xrow b { width: 70px; font-weight: 800; font-size: 56px; color: var(--text); }
.xrow.hot { color: var(--text); border-color: rgba(25,195,86,.6); background: linear-gradient(90deg, rgba(23,177,78,.18), rgba(19,23,47,.9)); }
.xrow.hot b { color: #5BE38A; }
.xrow .note { margin-left: auto; font-size: 26px; font-weight: 800; letter-spacing: .12em; text-transform: uppercase; color: #5BE38A; }
.vinyl { position: absolute; right: 70px; top: 10px; width: 210px; height: 210px; }

/* paper */
.paper { width: 100%; padding: 56px 56px 50px; }
.paper .meta { font-weight: 700; font-size: 24px; letter-spacing: .14em; text-transform: uppercase; color: var(--softtext); }
.paper .title { font-weight: 800; font-size: 74px; line-height: 1.05; letter-spacing: -0.03em; margin: 22px 0 34px; }
.authors { display: grid; grid-template-columns: repeat(4, 1fr); gap: 14px 18px; }
.authors span { font-weight: 700; font-size: 26px; color: var(--muted); padding: 12px 0; border-top: 1.5px solid var(--border-soft); }
.paper .venue { margin-top: 30px; font-weight: 600; font-size: 26px; color: var(--muted); }

/* morph */
.mblock { width: 100%; padding: 40px 44px; }
.mblock .t { font-weight: 800; font-size: 76px; line-height: 1.05; letter-spacing: -0.03em; }
.mblock .s { font-weight: 700; font-size: 26px; letter-spacing: .14em; text-transform: uppercase; color: var(--softtext); margin-top: 16px; }
.arrow { width: 100%; height: 110px; }

/* attention */
.tokens { position: relative; display: flex; flex-wrap: wrap; gap: 26px 20px; width: 100%; margin: 170px 0 150px; }
.tok { position: relative; font-weight: 800; font-size: 60px; padding: 16px 28px; border-radius: 20px; border: 1.5px solid var(--border-soft); background: rgba(27,30,60,.85); }
.tok .heat { position: absolute; inset: 0; border-radius: 20px; background: linear-gradient(135deg, rgba(166,167,255,.9), rgba(68,101,238,.9)); opacity: 0; }
.tok span { position: relative; }
.tok.focus { background: var(--grad-btn); border-color: transparent; box-shadow: 0 0 34px rgba(84,80,217,.8); }
.arcs { position: absolute; left: 0; top: 0; width: 1080px; height: 920px; pointer-events: none; overflow: visible; }

/* race */
.race { width: 100%; display: flex; flex-direction: column; gap: 34px; margin-top: 30px; }
.lane .lbl { display: flex; justify-content: space-between; font-weight: 800; font-size: 38px; margin-bottom: 14px; }
.lane .lbl span { color: var(--muted); font-weight: 700; }
.lane .track { height: 58px; border-radius: 16px; background: rgba(166,167,255,.08); overflow: hidden; }
.lane .bar { height: 100%; border-radius: 16px; transform-origin: left center; background: linear-gradient(90deg, #4A3AC1, #6C7CF6); }
.lane.win .bar { background: linear-gradient(90deg, #17B14E, #5BE38A); box-shadow: 0 0 30px rgba(25,195,86,.55); }
.lane.win .lbl { color: #5BE38A; }
.source { margin-top: 34px; font-weight: 600; font-size: 22px; color: var(--softtext); }

/* news */
.news { width: 100%; padding: 50px 50px 44px; position: relative; overflow: hidden; }
.news .top { display: flex; align-items: center; gap: 20px; margin-bottom: 34px; }
.live { display: inline-flex; align-items: center; gap: 12px; font-weight: 800; font-size: 26px; letter-spacing: .16em; text-transform: uppercase; color: #fff;
  background: var(--grad-ok); padding: 12px 24px; border-radius: 999px; }
.live i { width: 14px; height: 14px; border-radius: 50%; background: #fff; }
.news .date { font-weight: 800; font-size: 28px; letter-spacing: .12em; text-transform: uppercase; color: var(--lav); }
.news .hl { font-weight: 800; font-size: 62px; line-height: 1.1; letter-spacing: -0.025em; }
.news .dt { margin-top: 30px; font-weight: 600; font-size: 34px; line-height: 1.35; color: var(--muted); }
.news .src { margin-top: 30px; font-weight: 700; font-size: 22px; color: var(--softtext); letter-spacing: .06em; }
.news .scan { position: absolute; left: 0; right: 0; top: 0; height: 6px; background: var(--grad-ok); }

/* cta */
.aecodito { width: 440px; height: 440px; object-fit: contain; filter: drop-shadow(0 30px 60px rgba(74,58,193,.55)); }
.logo { width: 700px; margin-top: 18px; }
.tagline { font-weight: 700; font-size: 42px; color: var(--muted); margin-top: 30px; }
.url { margin-top: 36px; font-weight: 800; font-size: 44px; letter-spacing: .02em; color: #fff; padding: 22px 56px; border-radius: 999px; background: var(--grad-btn); box-shadow: 0 0 40px rgba(84,80,217,.7); }
.next { margin-top: 44px; font-weight: 700; font-size: 30px; color: var(--muted); }
.next b { color: var(--text); }
.halo { position: absolute; left: 50%; top: 150px; width: 620px; height: 620px; margin-left: -310px; border-radius: 50%;
  background: radial-gradient(circle, rgba(166,167,255,.35), rgba(74,58,193,.15) 45%, transparent 70%); }
</style>
</head>
<body>
<div id="stage">
  <div class="bg">
    <div class="glow g1"></div><div class="glow g2"></div><div class="glow g3"></div>
    <div class="grid"></div>
    <div class="vignette"></div>
  </div>
  <header>
    <div class="iso"></div>
    <div class="series"><b>AECODE</b> · <span id="series"></span></div>
    <div class="ep" id="ep"></div>
  </header>
  <div class="progress"><i id="bar"></i></div>
  <main id="scenes"></main>
</div>

<script>
/* ============================================================
   Motor de línea de tiempo determinista.
   Python llama load(data) una vez y luego seek(t) por cada frame.
   ============================================================ */
const clamp = (x, a = 0, b = 1) => Math.max(a, Math.min(b, x));
const lerp = (a, b, p) => a + (b - a) * p;
const EASE = {
  out: p => 1 - Math.pow(1 - p, 3),
  outExpo: p => (p >= 1 ? 1 : 1 - Math.pow(2, -10 * p)),
  inOut: p => (p < .5 ? 4 * p * p * p : 1 - Math.pow(-2 * p + 2, 3) / 2),
  back: p => { const c1 = 1.70158, c3 = c1 + 1; return 1 + c3 * Math.pow(p - 1, 3) + c1 * Math.pow(p - 1, 2); },
  lin: p => p,
};
const esc = s => String(s).replace(/&/g, "&amp;").replace(/</g, "&lt;");
// *texto* -> acento con gradiente
const rich = s => esc(s).replace(/&lt;br&gt;/g, "<br>").replace(/\*(.+?)\*/g, "<em>$1</em>");
const initials = n => n.split(" ").map(w => w[0]).slice(0, 2).join("");
let rng = 1;
const rand = () => { rng = (rng * 16807) % 2147483647; return (rng - 1) / 2147483646; };

// Palabras con entrada escalonada; respeta *acentos* y <br>.
function words(text, t0 = 0.15, step = 0.07, cls = "") {
  let t = t0, out = "", accent = false;
  for (const part of String(text).split(/(\*|<br>)/)) {
    if (part === "*") { accent = !accent; continue; }
    if (part === "<br>") { out += "<br>"; continue; }
    for (const w of part.split(/(\s+)/)) {
      if (!w) continue;
      if (/^\s+$/.test(w)) { out += " "; continue; }
      out += `<span class="w ${cls}" data-a="up" data-t="${t.toFixed(2)}"><span class="${accent ? "acc" : ""}">${esc(w)}</span></span>`;
      t += step;
    }
  }
  return out;
}

/* ---------- plantillas ---------- */
const TPL = {
  hook(s) {
    const year = (s.kicker.match(/\d{4}/) || [""])[0];
    return `<div class="hookwrap">${year ? `<div class="bgword" data-a="fade" data-t="0" data-d="1.2">${year}</div>` : ""}
      <div class="kicker" data-a="up" data-t="0"><span class="dot"></span>${esc(s.kicker)}</div>
      <h1 class="h-xl">${words(s.headline, 0.12, 0.075)}</h1></div>`;
  },

  rewind(s) {
    const ticks = [];
    for (let y = 1956; y <= 2026; y += 10) ticks.push(y);
    const x = y => ((y - 1956) / 70) * 920;
    s.update = (local, el) => {
      const p = EASE.inOut(clamp((local - 0.45) / 2.2));
      const y = lerp(s.counter_from, s.counter_to, p);
      el.querySelector(".mark").style.left = x(y) + "px";
    };
    return `<div class="kicker" data-a="up" data-t="0"><span class="dot"></span>${esc(s.label)}</div>
      <div class="pill violet" data-a="pop" data-t="0.25">${esc(s.badge)}</div>
      <div class="counter acc" data-a="count" data-from="${s.counter_from}" data-to="${s.counter_to}" data-t="0.45" data-d="2.2" data-ease="inOut" style="margin-top:30px">${s.counter_from}</div>
      <div class="ruler" data-a="fade" data-t="0.3">
        <div class="line"></div>
        ${ticks.map(y => `<div class="tick" style="left:${x(y) - 1.5}px"><span>${y === 2026 ? "" : y}</span></div>`).join("")}
        <div class="tick" style="left:${x(2026) - 1.5}px"><span>2026</span></div>
        <div class="mark" style="left:${x(2026)}px"></div>
      </div>
      <div class="body-lg" data-a="up" data-t="c1" style="margin-top:34px;max-width:900px">${esc(s.caption)}</div>`;
  },

  people(s) {
    const at = ["c0+0.35", "c1", "c2", "c2+0.45"];
    return `<div class="kicker" data-a="up" data-t="0"><span class="dot"></span>La propuesta · 1955</div>
      <div class="people">${s.people.map((p, i) => `
        <div class="card person" data-a="up" data-t="${at[i]}">
          <div class="avatar">${initials(p[0])}</div>
          <div><div class="n">${esc(p[0])}</div><div class="o">${esc(p[1])}</div></div>
        </div>`).join("")}
      </div>
      <div class="term" data-a="up" data-t="${s.term_at}">
        <div class="t acc">${esc(s.term)}</div>
        <div class="note">${esc(s.term_note)}</div>
      </div>`;
  },

  stats(s) {

  curves(s) {

      <svg class="chart" viewBox="0 0 ${W} ${H + 80}">

        <span><i style="background:#19C356"></i>Lo que realmente pasa</span>
      </div>`;
  },

  goboard(s) {
    s.center = true;
    rng = 37;
    const N = 19, size = 800, m = 40, g = (size - 2 * m) / (N - 1);
    const P = i => m + i * g;
    let lines = "";
    for (let i = 0; i < N; i++) {
      lines += `<line x1="${P(0)}" y1="${P(i)}" x2="${P(18)}" y2="${P(i)}"/><line x1="${P(i)}" y1="${P(0)}" x2="${P(i)}" y2="${P(18)}"/>`;
    }
    const stars = [3, 9, 15].flatMap(a => [3, 9, 15].map(b => `<circle cx="${P(a)}" cy="${P(b)}" r="6" fill="rgba(166,167,255,.45)"/>`)).join("");
    // Apertura ilustrativa (no es el registro real de la partida).
    const taken = new Set(["13,9"]);
    const seeds = [[3, 3], [15, 15], [15, 3], [3, 15], [2, 5], [5, 2], [16, 13], [13, 16], [9, 3], [16, 9], [9, 15], [2, 11], [11, 2], [14, 5], [5, 14], [16, 5], [17, 6], [12, 15], [6, 16], [15, 11], [3, 9], [10, 16], [7, 3], [14, 13], [4, 12], [17, 14], [15, 7], [12, 3], [2, 14], [8, 16], [17, 10], [14, 2], [4, 6], [16, 16], [6, 4], [11, 14]];
    let stones = "";
    seeds.forEach(([x, y], i) => {
      if (taken.has(`${x},${y}`)) return;
      taken.add(`${x},${y}`);
      const black = i % 2 === 0;
      stones += `<circle cx="${P(x)}" cy="${P(y)}" r="${g * 0.46}" fill="${black ? "url(#bs)" : "url(#ws)"}" data-a="pop" data-t="${(0.1 + i * 0.035).toFixed(3)}" data-d=".25"/>`;
    });
    const hx = P(13), hy = P(9);
    return `<div class="kicker" data-a="up" data-t="0"><span class="dot"></span>${esc(s.label)}</div>
      <div style="position:relative">
        <svg class="board" viewBox="0 0 ${size} ${size}">

            <radialGradient id="bs" cx=".35" cy=".3"><stop offset="0" stop-color="#5A51C9"/><stop offset="1" stop-color="#1B1640"/></radialGradient>
            <radialGradient id="ws" cx=".35" cy=".3"><stop offset="0" stop-color="#FFFFFF"/><stop offset="1" stop-color="#C3CCE0"/></radialGradient>
          </defs>
          <rect x="6" y="6" width="${size - 12}" height="${size - 12}" rx="26" fill="rgba(19,23,47,.75)" stroke="rgba(124,126,223,.3)" stroke-width="2"/>
          <g stroke="rgba(166,167,255,.22)" stroke-width="2">${lines}</g>${stars}${stones}
          <circle cx="${hx}" cy="${hy}" r="${g * 1.6}" fill="none" stroke="#19C356" stroke-width="4" data-a="ring" data-t="c1+0.25" data-d="1.4"/>
          <circle cx="${hx}" cy="${hy}" r="${g * 0.52}" fill="url(#bs)" stroke="#19C356" stroke-width="5" data-a="pop" data-t="c1" data-d=".45" style="filter:drop-shadow(0 0 16px rgba(25,195,86,.9))"/>
          <text x="${hx}" y="${hy + 11}" text-anchor="middle" font-family="Manrope" font-weight="800" font-size="28" fill="#fff" data-a="fade" data-t="c1+0.2">37</text>
        </svg>
        <div class="tag q" data-a="pop" data-t="c2+1.2" style="left:${hx - 210}px;top:${hy - 150}px">¿Un error?</div>
      </div>
      <div class="pill" data-a="fade" data-t="0.8" style="margin-top:26px;font-size:20px;padding:10px 20px">${esc(s.note)}</div>`;
  },

  dots(s) {
    s.center = true;
    s.init = el => {
      const c = el.querySelector("canvas");
      c.width = 620; c.height = 620;
      s.ctx = c.getContext("2d");
    };
    s.update = local => {
      const ctx = s.ctx, n = 100, pitch = 6.2, r = 2.9;
      ctx.clearRect(0, 0, 620, 620);
      const reveal = clamp((local - 0.2) / 1.2);
      const focus = clamp((local - s.tt("c1")) / 0.8);
      const hx = 71, hy = 38;
      for (let y = 0; y < n; y++) {
        for (let x = 0; x < n; x++) {
          const d = (x + y) / 198;
          const a = clamp((reveal * 1.4 - d) * 4);
          if (a <= 0) continue;
          ctx.globalAlpha = a * lerp(0.85, 0.38, focus);
          ctx.fillStyle = "#A6A7FF";
          ctx.fillRect(x * pitch + 1.6, y * pitch + 1.6, r, r);
        }
      }
      ctx.globalAlpha = 1;
      if (focus > 0) {
        const cx = hx * pitch + 3, cy = hy * pitch + 3;
        const e = EASE.back(focus);
        ctx.fillStyle = "#19C356";
        ctx.shadowColor = "rgba(25,195,86,.95)"; ctx.shadowBlur = 24;
        ctx.beginPath(); ctx.arc(cx, cy, 9 * e, 0, Math.PI * 2); ctx.fill();
        ctx.shadowBlur = 0;
        const ring = ((local - s.tt("c1")) % 1.4) / 1.4;
        ctx.strokeStyle = `rgba(25,195,86,${(1 - ring) * 0.8})`; ctx.lineWidth = 3;
        ctx.beginPath(); ctx.arc(cx, cy, 12 + ring * 60, 0, Math.PI * 2); ctx.stroke();
      }
    };
    return `<div class="h-lg" data-a="pop" data-t="c1"><span class="acc">${esc(s.big)}</span></div>
      <div class="dotsbox" data-a="fade" data-t="0"><canvas></canvas></div>
      <div class="body-lg" data-a="up" data-t="c1+0.4" style="margin-top:30px;font-size:32px">${esc(s.caption)}</div>`;
  },

  timer(s) {
    s.center = true;
    const R = 270, C = 2 * Math.PI * R;
    s.update = (local, el) => {
      const p = EASE.inOut(clamp((local - 0.3) / 2.6));
      el.querySelector(".arc").style.strokeDashoffset = C * (1 - p);
      const secs = Math.round(p * s.minutes * 60);
      el.querySelector(".mm").textContent = `${String(Math.floor(secs / 60)).padStart(2, "0")}:${String(secs % 60).padStart(2, "0")}`;
    };
    return `<div class="kicker" data-a="up" data-t="0"><span class="dot"></span>${esc(s.caption)}</div>
      <div style="position:relative" data-a="scale" data-t="0.1">
        <svg class="ring" viewBox="0 0 600 600">

          <circle cx="300" cy="300" r="${R}" fill="none" stroke="rgba(166,167,255,.12)" stroke-width="22"/>
          <circle class="arc" cx="300" cy="300" r="${R}" fill="none" stroke="url(#rg)" stroke-width="22" stroke-linecap="round"
            stroke-dasharray="${C}" stroke-dashoffset="${C}" transform="rotate(-90 300 300)" style="filter:drop-shadow(0 0 14px rgba(84,80,217,.8))"/>
        </svg>
        <div class="clock"><div class="mm">00:00</div><div class="u">minutos</div></div>
      </div>`;
  },

  score(s) {

  attention(s) {
    s.init = el => {
      const box = el.querySelector(".tokens"), svg = el.querySelector(".arcs");
      const base = el.getBoundingClientRect();
      const toks = [...el.querySelectorAll(".tok")];
      const c = t => { const r = t.getBoundingClientRect(); return [r.left - base.left + r.width / 2, r.top - base.top, r.bottom - base.top]; };
      const [fx, ft, fb] = c(toks[s.focus]);
      const row0 = toks[0].getBoundingClientRect().top;
      let paths = "";
      toks.forEach((t, i) => {
        if (i === s.focus) return;
        const [x, top, bot] = c(t);
        const w = s.weights[i];
        const sameRow = Math.abs(t.getBoundingClientRect().top - row0) < 5;
        const y1 = sameRow ? ft - 8 : fb + 8, y2 = sameRow ? top - 8 : top - 8;
        const lift = sameRow ? -(70 + Math.abs(x - fx) * 0.35) : 0;
        const d = sameRow
          ? `M ${fx} ${y1} C ${fx} ${y1 + lift}, ${x} ${y2 + lift}, ${x} ${y2}`
          : `M ${fx} ${y1} C ${fx} ${y1 + 60}, ${x} ${y2 - 60}, ${x} ${y2}`;
        paths += `<path d="${d}" fill="none" stroke="${w > 0.5 ? "#A6A7FF" : "#6C7CF6"}" stroke-width="${(2 + w * 9).toFixed(1)}" stroke-linecap="round"
          opacity="${(0.25 + w * 0.75).toFixed(2)}" data-a="draw" data-t="${(s.tt("c1") + i * 0.08).toFixed(2)}" data-d=".7"/>`;
      });
      svg.innerHTML = paths;
      registerAnims(s, svg);
    };
    return `<div class="kicker" data-a="up" data-t="0"><span class="dot"></span>La idea clave: atención</div>
      <svg class="arcs"></svg>
      <div class="tokens">${s.tokens.map((t, i) => `
        <div class="tok ${i === s.focus ? "focus" : ""}" data-a="up" data-t="${(0.15 + i * 0.07).toFixed(2)}">
          ${i === s.focus ? "" : `<div class="heat" data-a="heat" data-v="${s.weights[i]}" data-t="c1+0.4" data-d=".8"></div>`}<span>${esc(t)}</span></div>`).join("")}
      </div>
      <div class="body-lg" data-a="up" data-t="c2">${esc(s.label)}</div>`;
  },

  news(s) {
    return `<div class="card news" data-a="up" data-t="0">
        <div class="scan" data-a="grow" data-t="0.2" data-d="1.2"></div>
        <div class="top"><div class="live" data-a="pop" data-t="0.2"><i data-a="blink" data-t="0.2"></i>${esc(s.badge)}</div><div class="date" data-a="fade" data-t="0.35">${esc(s.date)}</div></div>
        <div class="hl">${words(s.headline, 0.45, 0.05)}</div>
        <div class="dt" data-a="up" data-t="c2">${esc(s.detail)}</div>
        <div class="src" data-a="fade" data-t="c2+0.4">${esc(s.source)}</div>
      </div>`;
  },

  cta(s, ep) {
    s.center = true;
    const next = ep.next_title
      ? `Próxima historia → <b>${esc(ep.next_title)}</b>`
      : `Serie completa · <b>${ep.total} historias</b>`;
    return `<div class="halo" data-a="fade" data-t="0"></div>
      <img class="aecodito" src="../../brand/assets/reference/aecodito-home.png" data-a="float" data-t="0.05">
      <img class="logo" src="../../brand/assets/logos/aecode-logo-principal-fondo-oscuro.png" data-a="up" data-t="0.35">
      <div class="tagline" data-a="up" data-t="0.55">Aprende IA aplicada a la construcción</div>
      <div class="url" data-a="pop" data-t="0.8">aecode.io</div>
      <div class="next" data-a="up" data-t="1.1">${next}</div>`;
  },
};

/* ---------- carga ---------- */
const STATE = { scenes: [], total: 0 };

function resolveT(s, v) {
  if (v === undefined || v === null || v === "") return 0;
  if (typeof v === "number") return v;
  const m = /^c(\d+)(?:\+([\d.]+))?$/.exec(v);
  if (m) {
    const c = s.clauses[Math.min(+m[1], s.clauses.length - 1)];
    return (c ? c[0] : 0) + (m[2] ? parseFloat(m[2]) : 0);
  }
  return parseFloat(v) || 0;
}

function registerAnims(s, root) {
  root.querySelectorAll("[data-a]").forEach(el => {
    if (el._reg) return;
    el._reg = true;
    el._a = el.dataset.a;
    el._t = resolveT(s, el.dataset.t);
    el._d = parseFloat(el.dataset.d || ({ count: 1.2, draw: 1.0, grow: 0.9, float: 99, spin: 99, blink: 99, glow: 99 })[el._a] || 0.7);
    if (el._a === "draw") {
      const len = el.getTotalLength ? el.getTotalLength() : 1000;
      el._len = len;
      el.style.strokeDasharray = len; el.style.strokeDashoffset = len;
    }
    s.anims.push(el);
  });
}

function load(data) {
  const ep = data.episode;
  document.getElementById("series").textContent = data.series;
  document.getElementById("ep").textContent = `EP ${String(ep.number).padStart(2, "0")} / ${String(data.total).padStart(2, "0")}`;
  ep.total = data.total;
  STATE.total = data.duration;
  const root = document.getElementById("scenes");
  data.scenes.forEach(s => {
    s.anims = [];
    s.tt = v => resolveT(s, v);
    const sec = document.createElement("section");
    sec.className = "scene";
    sec.innerHTML = TPL[s.type](s, ep);
    if (s.center) sec.classList.add("center");
    root.appendChild(sec);
    s.el = sec;
    STATE.scenes.push(s);
  });
  return document.fonts.ready.then(() => Promise.all([...document.images].map(i => i.decode().catch(() => {})))).then(() => {
    STATE.scenes.forEach(s => {
      s.el.style.visibility = "visible";
      if (s.init) s.init(s.el);
      registerAnims(s, s.el);
      s.el.style.visibility = "hidden";
    });
    window.__ready = true;
  });
}

function applyAnim(el, local) {
  const raw = (local - el._t) / el._d;
  const p = clamp(raw);
  const a = el._a;
  if (a === "up") {
    const e = EASE.out(p);
    el.style.opacity = e;
    el.style.transform = `translateY(${(1 - e) * 46}px)`;
    el.style.filter = p < 1 ? `blur(${(1 - e) * 10}px)` : "none";
  } else if (a === "fade") {
    el.style.opacity = EASE.out(p);
  } else if (a === "scale") {
    const e = EASE.out(p);
    el.style.opacity = e;
    el.style.transform = `scale(${0.92 + 0.08 * e})`;
  } else if (a === "pop") {
    const e = p <= 0 ? 0 : EASE.back(p);
    el.style.opacity = clamp(p * 3);
    el.style.transform = `scale(${Math.max(0, e)})`;
    el.style.transformBox = "fill-box";
    el.style.transformOrigin = "center";
  } else if (a === "grow") {
    el.style.transform = `scaleX(${EASE.outExpo(p)})`;
    el.style.transformOrigin = "left center";
  } else if (a === "draw") {
    el.style.strokeDashoffset = el._len * (1 - EASE.inOut(p));
  } else if (a === "wipe") {
    el.setAttribute("width", +el.dataset.w * EASE.inOut(p));
  } else if (a === "count") {
    const e = (EASE[el.dataset.ease] || EASE.out)(p);
    el.textContent = Math.round(lerp(+el.dataset.from, +el.dataset.to, e));
  } else if (a === "ring") {
    const k = raw < 0 ? -1 : (raw % 1);
    el.style.opacity = k < 0 ? 0 : (1 - k) * 0.9;
    el.style.transform = `scale(${0.4 + (k < 0 ? 0 : k) * 0.9})`;
    el.style.transformBox = "fill-box";
    el.style.transformOrigin = "center";
  } else if (a === "heat") {
    el.style.opacity = +el.dataset.v * EASE.out(p) * 0.85;
  } else if (a === "float") {
    const e = EASE.out(clamp((local - el._t) / 0.8));
    el.style.opacity = e;
    el.style.transform = `translateY(${(1 - e) * 60 + Math.sin(local * 1.8) * 10}px)`;
  } else if (a === "spin") {
    el.style.opacity = EASE.out(clamp((local - el._t) / 0.6));
    el.style.transform = `rotate(${local * 90}deg)`;
  } else if (a === "blink") {
    el.style.opacity = 0.35 + 0.65 * (0.5 + 0.5 * Math.cos(local * 5));
  } else if (a === "glow") {
    const on = local >= el._t;
    el.style.boxShadow = on ? `0 0 0 ${6 + 4 * Math.sin(local * 5)}px rgba(25,195,86,.55), 0 0 36px rgba(25,195,86,.8)` : "none";
  }
}

const EXIT = 0.38;
function seek(t) {
  document.getElementById("bar").style.width = `${clamp(t / STATE.total) * 100}%`;
  const g = document.querySelectorAll(".glow");
  g[0].style.transform = `translate(${-420 + Math.sin(t * .23) * 90}px, ${-260 + Math.cos(t * .19) * 70}px)`;
  g[1].style.transform = `translate(${260 + Math.cos(t * .17) * 110}px, ${820 + Math.sin(t * .21) * 90}px)`;
  g[2].style.transform = `translate(${-200 + Math.sin(t * .13) * 120}px, ${1180 + Math.cos(t * .15) * 60}px)`;

  STATE.scenes.forEach((s, i) => {
    const last = i === STATE.scenes.length - 1;
    const visible = t >= s.start && (last || t < s.end + EXIT * 0.5);
    s.el.style.visibility = visible ? "visible" : "hidden";
    if (!visible) return;
    const local = t - s.start;
    const out = last ? 0 : EASE.inOut(clamp((t - (s.end - EXIT * 0.5)) / EXIT));
    s.el.style.opacity = 1 - out;
    s.el.style.transform = `translateY(${-50 * out}px) scale(${1 - 0.03 * out})`;
    s.el.style.filter = out > 0 ? `blur(${out * 8}px)` : "none";
    s.anims.forEach(el => applyAnim(el, local));
    if (s.update) s.update(local, s.el);
  });
}
</script>
</body>
</html>
