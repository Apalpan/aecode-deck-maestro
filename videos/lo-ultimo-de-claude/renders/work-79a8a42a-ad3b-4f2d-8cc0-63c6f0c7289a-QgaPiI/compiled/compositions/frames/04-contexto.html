      tl.to(numwrap, { scale: 1, duration: 0.6, ease: "elastic.out(1, 0.5)" }, COUNT_AT + COUNT_DUR + 0.12);

      // label on "tokens de contexto" (@1.2)
      tl.fromTo(label, { opacity: 0, y: 18 }, { opacity: 1, y: 0, duration: 0.5, ease: "power3.out" }, 1.2);
      // model chip beneath, on "contexto"
      tl.fromTo(models, { opacity: 0, y: 14, scale: 0.94 }, { opacity: 1, y: 0, scale: 1, duration: 0.45, ease: "back.out(1.6)" }, 1.75);

      // ---- Scene 3 (2.5–4.3): "≈ 555.000 palabras" on "Más de quinientas mil palabras" ----
      var wordsState = { v: 0 };
      tl.fromTo(words, { opacity: 0, y: 16 }, { opacity: 1, y: 0, duration: 0.5, ease: "power3.out" }, 2.55);
      tl.to(wordsState, {
        v: 555000,
        duration: 1.1,
        ease: "power2.out",
        onUpdate: function () {
          wlive.textContent = fmt(Math.round(wordsState.v));
        }
      }, 2.6);

      // ---- Scene 4 (4.4–6.2): the conversation window fades up on "tu expediente" ----
      tl.fromTo(win, { opacity: 0, y: 48, scale: 0.97 }, { opacity: 1, y: 0, scale: 1, duration: 0.75, ease: "power3.out" }, 4.38);

      // grid-card-assemble cascade, paced by dynamic-content-sequencing:
      // each document's window is BASE + name.length × SEC_PER_CHAR, pre-computed ONCE,
      // then the flat schedule is fitted onto "expediente técnico completo" (4.60 → 5.70).
      var DOCS = [
        { name: "Planos", el: byId("f04-contexto-tile-1"), rot: -4 },
        { name: "Especificaciones", el: byId("f04-contexto-tile-2"), rot: 3 },
        { name: "Contratos", el: byId("f04-contexto-tile-3"), rot: -2.5 },
        { name: "RFIs", el: byId("f04-contexto-tile-4"), rot: 3.5 },
        { name: "Presupuesto", el: byId("f04-contexto-tile-5"), rot: -3 },
        { name: "Cronograma", el: byId("f04-contexto-tile-6"), rot: 2.5 }
      ];
      var BASE_DURATION = 0.6;
      var SEC_PER_CHAR = 0.04;
      var cumulative = 0;
      var SEQ = DOCS.map(function (doc) {
        var start = cumulative;
        cumulative += BASE_DURATION + doc.name.length * SEC_PER_CHAR;
        return { el: doc.el, rot: doc.rot, start: start };
      });
      var WIN_START = 4.6;
      var WIN_END = 5.7;
      var lastStart = SEQ[SEQ.length - 1].start;
      for (var i = 0; i < SEQ.length; i++) {
        var entry = SEQ[i];
        var at = WIN_START + (entry.start / lastStart) * (WIN_END - WIN_START);
        tl.fromTo(entry.el, { opacity: 0 }, { opacity: 1, duration: 0.22, ease: "power1.out" }, at);
        tl.fromTo(
          entry.el,
          { y: -140, rotation: entry.rot, scale: 1.06 },
          { y: 0, rotation: 0, scale: 1, duration: 0.62, ease: "back.out(1.5)" },
          at
        );
      }

      // ---- Scene 5 (6.3–8.12): "una sola conversación" — border to lavender + ai-glow bloom, chip pops; hold ----
      tl.fromTo(ring, { opacity: 0 }, { opacity: 1, duration: 0.45, ease: "power2.out" }, 6.34);
      tl.fromTo(glow, { opacity: 0, scale: 0.97 }, { opacity: 1, scale: 1, duration: 0.45, ease: "power2.out" }, 6.34);
      tl.to(glow, { opacity: 0.6, duration: 0.9, ease: "power2.inOut" }, 6.79);
      tl.fromTo(convchip, { opacity: 0, scale: 0.5 }, { opacity: 1, scale: 1, duration: 0.5, ease: "back.out(2.2)" }, 6.36);

      window.__timelines = window.__timelines || {};
      window.__timelines["04-contexto"] = tl;
    })();
  </script>
