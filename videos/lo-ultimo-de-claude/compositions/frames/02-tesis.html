  <script>
    (function () {
      const $ = (id) => document.getElementById("f02-tesis-" + id);
      const tl = gsap.timeline({ paused: true, defaults: { ease: "power3.out" } });

      // ---- chrome: fade in, then hold perfectly still ----
      tl.fromTo($("brand"), { opacity: 0 }, { opacity: 1, duration: 0.35, ease: "power1.out" }, 0);

      // ---- Scene 1 (0.0–1.6): chat bubble "ANTES", typing dots → "responde" ----
      // origin-anchored pop from the tail (bottom-left)
      tl.fromTo(
        $("bubble-pop"),
        { opacity: 0, scale: 0.6 },
        { opacity: 1, scale: 1, duration: 0.55 },
        0.05,
      );
      tl.fromTo(
        $("caption"),
        { opacity: 0, y: 10 },
        { opacity: 1, y: 0, duration: 0.45 },
        0.2,
      );
      // typing dots: two finite bounce waves, unrolled into explicit tweens
      const dots = [$("dot0"), $("dot1"), $("dot2")];
      for (let k = 0; k < 2; k++) {
        dots.forEach((d, i) => {
          const t0 = 0.38 + k * 0.32 + i * 0.09;
          tl.to(d, { y: -10, opacity: 1, duration: 0.12, ease: "sine.out" }, t0);
          tl.to(d, { y: 0, opacity: 0.45, duration: 0.12, ease: "sine.in" }, t0 + 0.12);
        });
      }
      // dots resolve into the word — streamed in token chunks (discrete states)
      tl.fromTo(
        $("dots"),
        { opacity: 1 },
        { opacity: 0, duration: 0.08, ease: "none", immediateRender: false },
        1.1,
      );
      [$("ch1"), $("ch2"), $("ch3")].forEach((c, i) => {
        tl.fromTo(c, { opacity: 0 }, { opacity: 1, duration: 0.05, ease: "none" }, 1.18 + i * 0.07);
      });

      // ---- Scene 2 (1.6–2.5): bubble scales down, slides far left, dims to ~40% ----
      // bubble center (720,500) → (250.5,500); 620×322 @0.55 → left edge x=80
      tl.fromTo(
        $("bubble-move"),
        { x: 0, scale: 1, opacity: 1 },
        {
          x: -469.5,
          scale: 0.55,
          opacity: 0.4,
          duration: 0.75,
          ease: "power3.inOut",
          immediateRender: false,
        },
        1.65,
      );

      // ---- Scene 3 (2.5–3.6): card morphs out of the bubble's slot to center ----
      // card-morph-anchor: ONE tween, uniform scale + x + paint-only radius.
      // start = the parked bubble's apparent rect: 341×177 @ center (250.5,500)
      const S0 = 341 / 1040; // 0.327885
      const R0 = (32 * 0.55) / S0; // apparent 17.6px radius, pre-scale
      const R0_BL = (8 * 0.55) / S0; // tail corner
      const MORPH_START = 2.5;
      const MORPH_DUR = 0.9;
      const MORPH_FROM = {
        x: -829.5,
        y: 0,
        scale: S0,
        borderTopLeftRadius: R0,
        borderTopRightRadius: R0,
        borderBottomRightRadius: R0,
        borderBottomLeftRadius: R0_BL,
      };
      const MORPH_TO = {
        x: 0,
        y: 0,
        scale: 1,
        borderTopLeftRadius: 24,
        borderTopRightRadius: 24,
        borderBottomRightRadius: 24,
        borderBottomLeftRadius: 24,
        duration: MORPH_DUR,
        ease: "power2.inOut",
      };
      tl.fromTo($("card"), { ...MORPH_FROM }, { ...MORPH_TO }, MORPH_START);
      // the glow layer rides the identical morph so it always sits exactly behind the card
      tl.fromTo($("glow"), { ...MORPH_FROM }, { ...MORPH_TO }, MORPH_START);
      // lifts off the dimmed bubble
      tl.fromTo(
        $("card"),
        { opacity: 0 },
        { opacity: 1, duration: 0.2, ease: "power1.out" },
        MORPH_START,
      );
      // surface shifts from bubble paint to card paint
      tl.fromTo(
        $("card-paint"),
        { opacity: 1 },
        { opacity: 0, duration: 0.7, ease: "power2.inOut", immediateRender: false },
        MORPH_START + 0.05,
      );
      // old content out over the first ~40%, new content in over the last ~40%
      tl.fromTo(
        $("content-old"),
        { opacity: 1 },
        { opacity: 0, duration: MORPH_DUR * 0.4, ease: "power1.in", immediateRender: false },
        MORPH_START + 0.02,
      );
      tl.fromTo(
        $("content-new"),
        { opacity: 0 },
        { opacity: 1, duration: MORPH_DUR * 0.4, ease: "power1.out" },
        MORPH_START + MORPH_DUR * 0.6,
      );
      tl.fromTo($("headline"), { y: 18 }, { y: 0, duration: 0.5 }, MORPH_START + 0.5);
      // ai-glow blooms behind the card, landing with its settle (bloom, then hold)
      tl.fromTo(
        $("glow"),
        { opacity: 0 },
        { opacity: 1, duration: 0.6, ease: "power2.out" },
        2.85,
      );

      // ---- Scene 4 (3.7–5.4): verb chips pop on each spoken verb ----
      const CHIP_AT = [3.7, 4.3, 4.9];
      ["chip1", "chip2", "chip3"].forEach((id, i) => {
        const chip = $(id);
        tl.fromTo(
          chip,
          { scale: 0, opacity: 0, y: 24 },
          { scale: 1, opacity: 1, y: 0, duration: 0.5 },
          CHIP_AT[i],
        );
        // 2px line icon draws on once the chip is arriving
        chip.querySelectorAll("path").forEach((p, j) => {
          tl.fromTo(
            p,
            { strokeDashoffset: 1.05 },
            { strokeDashoffset: 0, duration: 0.4, ease: "power2.out" },
            CHIP_AT[i] + 0.12 + j * 0.06,
          );
        });
      });

      // ---- Scene 5 (5.5–7.4): "trabajo real" + gradient-stroke underline, then hold ----
      tl.fromTo($("real"), { opacity: 0, y: 14 }, { opacity: 1, y: 0, duration: 0.45 }, 5.5);
      tl.fromTo($("underline"), { scaleX: 0 }, { scaleX: 1, duration: 0.5 }, 5.6);
      // 6.1 → 7.4: deliberate held read — nothing moves.

      window.__timelines = window.__timelines || {};
      window.__timelines["02-tesis"] = tl;
    })();
  </script>
