  <script>
    (function () {
      var P = "f07-conectores-";
      function el(id) {
        return document.getElementById(P + id);
      }
      function all(cls) {
        return Array.prototype.slice.call(
          document.querySelectorAll('[class~="' + P + cls + '"]'),
        );
      }

      var tl = gsap.timeline({ paused: true });

      /* ---- stroke-draw setup (measured geometry; +gap so round caps never leak) ---- */
      function prepDraw(node, len) {
        node.style.strokeDasharray = len + " " + (len + 10);
        node.style.strokeDashoffset = String(len + 6);
      }
      var ORBIT_LEN = 2007; // numeric arc length of the 380×252 ellipse (≈2005.9)
      var RING_LEN = 792; // 2π·126
      prepDraw(el("orbit"), ORBIT_LEN);
      prepDraw(el("hubring"), RING_LEN);
      var lines = all("line");
      var lineLen = lines.map(function (ln) {
        var len = Math.hypot(
          parseFloat(ln.getAttribute("x2")) - parseFloat(ln.getAttribute("x1")),
          parseFloat(ln.getAttribute("y2")) - parseFloat(ln.getAttribute("y1")),
        );
        prepDraw(ln, len);
        return len;
      });

      /* ---- chrome: opacity only, then perfectly still ---- */
      tl.fromTo(
        [el("brand"), el("index"), el("source")],
        { opacity: 0 },
        { opacity: 1, duration: 0.35, ease: "power1.out" },
        0,
      );

      /* ---- Scene 1 (0.0–0.8): listicle stage — kicker + date chip ---- */
      tl.fromTo(
        el("kicker"),
        { opacity: 0, y: 16 },
        { opacity: 1, y: 0, duration: 0.5, ease: "power3.out" },
        0.1,
      );
      tl.fromTo(
        el("chip"),
        { opacity: 0, y: 14 },
        { opacity: 1, y: 0, duration: 0.45, ease: "power3.out" },
        0.42,
      );

      /* ---- Scene 2 (0.3–2.4): numeral value-scaled count-up to 2.000+ on "dos mil" ---- */
      var num = el("num");
      var count = { v: 0 };
      function fmt(n) {
        if (n < 1000) return String(n);
        var r = n % 1000;
        return Math.floor(n / 1000) + "." + (r < 10 ? "00" : r < 100 ? "0" : "") + r;
      }
      var COUNT_AT = 0.3;
      var COUNT_DUR = 1.55;
      tl.fromTo(
        el("numwrap"),
        { opacity: 0 },
        { opacity: 1, duration: 0.3, ease: "power1.out" },
        COUNT_AT,
      );
      tl.fromTo(
        count,
        { v: 0 },
        {
          v: 2000,
          duration: COUNT_DUR,
          ease: "power3.out",
          onUpdate: function () {
            num.textContent = fmt(Math.round(count.v));
          },
        },
        COUNT_AT,
      );
      tl.fromTo(
        num,
        { scale: 0.55 },
        { scale: 1, duration: COUNT_DUR, ease: "power3.out" },
        COUNT_AT,
      );
      // suffix "+" gets its own beat after the count lands
      tl.fromTo(
        el("plus"),
        { opacity: 0, y: 28 },
        { opacity: 1, y: 0, duration: 0.42, ease: "back.out(1.6)" },
        COUNT_AT + COUNT_DUR,
      );
      // label reveals word-by-word on "conectores · y · plugins"
      var WORD_AT = [1.2, 1.86, 2.07];
      all("word").forEach(function (w, i) {
        tl.fromTo(
          w,
          { opacity: 0, y: 20 },
          { opacity: 1, y: 0, duration: 0.45, ease: "power3.out" },
          WORD_AT[i],
        );
      });

      /* ---- frame-then-fill: faint orbit ellipse draws, empty slots appear as the pen passes ---- */
      var ORBIT_AT = 1.35;
      var ORBIT_DUR = 1.1;
      tl.fromTo(
        el("orbit"),
        { strokeDashoffset: ORBIT_LEN + 6 },
        { strokeDashoffset: 0, duration: ORBIT_DUR, ease: "power1.inOut" },
        ORBIT_AT,
      );
      // arc-length fraction of each node angle (-90° + 45°·i) along the ellipse
      var FRAC = [0, 0.1408, 0.25, 0.3592, 0.5, 0.6408, 0.75, 0.8592];
      function invPower1InOut(f) {
        return f < 0.5 ? Math.sqrt(f / 2) : 1 - Math.sqrt((1 - f) / 2);
      }
      all("slot").forEach(function (s, i) {
        tl.fromTo(
          s,
          { opacity: 0, scale: 0.6 },
          { opacity: 1, scale: 1, duration: 0.35, ease: "power3.out" },
          ORBIT_AT + invPower1InOut(FRAC[i]) * ORBIT_DUR - 0.04,
        );
      });

      /* ---- camera: slow push that settles on the hub before the hold ---- */
      tl.fromTo(
        el("stage"),
        { scale: 0.96, transformOrigin: "1390px 495px" },
        { scale: 1, duration: 3.2, ease: "power2.inOut" },
        2.7,
      );

      /* ---- Scene 3 (2.8–3.7): hub spring-pops on "Claude se conecta"; lines draw outward ---- */
      tl.fromTo(
        el("hub"),
        { opacity: 0, scale: 0.4 },
        { opacity: 1, scale: 1, duration: 0.55, ease: "back.out(1.5)" },
        2.8,
